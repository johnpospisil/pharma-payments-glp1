alt_chart1b_targeting_statins: 'Three line charts, one per brand (Trulicity, Victoza, Ozempic), each with two lines: the change in the probability that a paid physician writes at least 11 claims of the paid brand, and the same for statins, a drug class unrelated to the payments. Both lines climb steadily before the first payment and keep rising after it. Averaged over years 0 to 3, statins rise +6.4, +7.9, +7.1 percentage points, so the brand increase reflects growing practices at least in part.'
alt_chart2_dose: 'Three dot charts, one per brand, comparing groups of newly paid physicians by first-year dollars and by number of contacts. The increase in the probability of at least 11 claims is larger for physicians who got $100 or more (Trulicity: 11.9 vs 16.8 points; Victoza: 5.2 vs 9.6 points; Ozempic: 13.2 vs 19.1 points) and for those with more contacts. The note says this reflects who gets paid more.'
alt_chart3_partd_spending: Stacked column chart of Medicare Part D spending on GLP-1 drugs by brand, 2013 to 2024. Total spending rises from $0.55 billion to $27.9 billion. Ozempic is the largest brand in 2024 (46%), followed by Trulicity and Mounjaro.
alt_chart4_payments_by_type: Six small stacked column charts of industry payments naming each GLP-1 brand per year, 2013 to 2025, split into speaker and consulting fees and other payments such as meals. Fees are 65% of all GLP-1 promotional dollars and meals 28%. Victoza and Trulicity peak before 2019; Ozempic, Rybelsus and Mounjaro dominate after.
alt_chart5_share_dumbbells: Dumbbell chart, two rows per brand, of the brand's share of a physician's GLP-1 prescriptions the year before the first payment and two years after. For Trulicity, Ozempic and Mounjaro, paid physicians' share rises more than matched comparison physicians' (Trulicity 35% vs 29%; Ozempic 34% vs 29%; Mounjaro 26% vs 18%). Victoza's share falls in both groups, more among paid physicians.
alt_chart6_state_map: 'Hexagon tile map of US states shaded by GLP-1 promotional payments per Medicare Part D enrollee with diabetes in 2024. Values range from $0.41 (MT) to $4.25 (CO); the US figure is $2.59. Higher values cluster in the South and mid-Atlantic. ID, ME, OR, VT are grey: withheld to protect privacy.'
alt_chart7_lorenz: 'Lorenz curve of GLP-1 promotional dollars across paid prescribers. The curve hugs the bottom axis until the top few percent: the top 1% received 76% of dollars, the top 10% 88%, and the bottom half 1.5%. Gini coefficient 0.92.'
alt_chart8_specialty: 'Two horizontal bar charts by specialty for 2024: the share of diabetes prescribers paid for a GLP-1, and GLP-1 promotional dollars per 1,000 other diabetes-drug claims. Endocrinology is highest on both ($1,421 per 1,000 claims) versus $234 for primary care.'
alt_hero_brand_share: Four small line charts, one per brand, of the change in the paid brand's share of a physician's GLP-1 prescriptions from four years before to three years after the first payment. Before payment, Trulicity's line stays near zero, Ozempic's drifts upward, Mounjaro has only the years around its launch and Victoza's falls steeply. After payment, the share rises for one to two years and then levels off, averaging Trulicity +4.1, Ozempic +3.0, Mounjaro +5.3 percentage points over years 0 to 3, while Victoza's share keeps falling (−4.8). With hidden small counts bounded against the result, the gains shrink to +1.8, +1.7, +1.8 points.
