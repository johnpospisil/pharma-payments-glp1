[project]
name = "ppg"
version = "0.1.0"
description = "Industry payments and GLP-1 prescribing in Medicare Part D: CMS Open Payments linked to Part D prescribers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    # ingest + storage
    "duckdb>=1.1",
    "polars>=1.12",
    "pyarrow>=18",
    "pandas>=2.2",
    "numpy>=2.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    # models
    "pyfixest>=0.28",
    "differences>=0.2",
    "statsmodels>=0.14",
    "linearmodels>=6.1",
    "scipy>=1.14",
    # viz
    "matplotlib>=3.9",
    "plotly>=5.24",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "jupyterlab>=4.3",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: needs the real data (Parquet on PPG_DATA_DIR); skipped if absent",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
